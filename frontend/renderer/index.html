<!doctype html>
<!--
  File : index.html
  Brief: Single page of the renderer. app.js builds the app shell and the screens inside #app.
  CSP  : connect-src allows the local backend (127.0.0.1, any port: the port is chosen at startup).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src http://127.0.0.1:*"
    />
    <title>SystemLens</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="styles/shell.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/views/hello.css" />
    <link rel="stylesheet" href="styles/views/cpuPerformance.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
