<!doctype html>
<!--
  File : index.html
  Brief: Single page of the renderer. Content is filled in by app.js.
  CSP  : connect-src allows the local backend (127.0.0.1, any port: the port is chosen at startup).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src http://127.0.0.1:*"
    />
    <title>SystemLens</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 id="message">Connecting to backend...</h1>
    <script type="module" src="app.js"></script>
  </body>
</html>
