# SystemLens backend API contract (source of truth for backend and frontend).
# Conventions: docs/api/api-guide.md. Change only with the user's approval.
openapi: 3.1.0
info:
  title: SystemLens Backend API
  version: 0.2.0
  description: >
    Local HTTP API served by systemlens-backend.exe on 127.0.0.1.
    The port is chosen at startup and reported to the Electron main process
    through the "SYSTEMLENS_READY {json}" stdout line.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "8765"
        description: Random in production (--port 0); 8765 when started by Tool/run-backend.ps1.
security:
  - bearerAuth: []
tags:
  - name: sample
    description: >
      Sample endpoints: exercise the FE <-> BE plumbing and serve as reference examples
      for real APIs. Registered only when the backend is built with SYSTEMLENS_ENABLE_SAMPLE_API=ON.
  - name: cpu
    description: >
      Processor facts and live CPU metrics (Performance > CPU screen). Measured by the backend every
      1000 ms; 501 on platforms without a CPU provider (macOS).
  - name: system
    description: Identity of the machine the backend runs on (shell header).
paths:
  /api/v1/sample/hello:
    get:
      tags: [sample]
      operationId: getSampleHello
      summary: Return a greeting that names the platform the backend runs on.
      description: >
        Proves FE <-> BE communication and that the backend reaches its platform library:
        the greeting comes from the hello provider of the platform plugin.
      responses:
        "200":
          description: Greeting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleHelloResponse"
              example:
                message: "hello from Windows"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/cpu/info:
    get:
      tags: [cpu]
      operationId: getCpuInfo
      summary: Static processor facts (model, topology, speeds, caches, virtualization).
      responses:
        "200":
          description: Processor facts. Values the platform cannot report are null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CpuInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/cpu/metrics:
    get:
      tags: [cpu]
      operationId: getCpuMetrics
      summary: Metrics of the last 1 s interval and the history of the last 60 intervals.
      description: >
        The backend samples the OS counters every sampleIntervalMs on its own thread; this endpoint
        returns the latest measured interval. 503 until the first interval has been measured
        (about one second after startup).
      responses:
        "200":
          description: Current metrics and history (oldest first).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CpuMetrics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/system/info:
    get:
      tags: [system]
      operationId: getSystemInfo
      summary: Host name, OS name and version, user name and platform.
      responses:
        "200":
          description: Machine identity. Texts the platform cannot report are empty strings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
              example:
                hostName: DESKTOP-SYSLENS
                osName: Windows 10 Home x64
                osVersion: Version 10.0.19045
                userName: ASUS
                platform: windows
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Random token generated by Electron main for each run and passed to the backend
        via the SYSTEMLENS_TOKEN environment variable. Not required when the backend runs with --dev.
  schemas:
    CpuInfo:
      type: object
      required: [model, sockets, cores, logicalProcessors, baseSpeedMhz, maxSpeedMhz, virtualization, cache, countersSource]
      properties:
        model: { type: string, description: 'Processor name, e.g. "Intel(R) Core(TM) i5-8300H CPU @ 2.30GHz".' }
        sockets: { type: integer, minimum: 1 }
        cores: { type: integer, minimum: 1, description: Physical cores, all sockets. }
        logicalProcessors: { type: integer, minimum: 1, description: Hardware threads, all sockets. }
        baseSpeedMhz: { type: [number, "null"], description: Nominal clock. }
        maxSpeedMhz: { type: [number, "null"], description: Highest clock reported by the OS (null on Windows). }
        virtualization: { type: string, enum: [enabled, disabled, unknown] }
        cache:
          type: object
          required: [l1Bytes, l2Bytes, l3Bytes]
          description: Total size per level over all caches of that level (shared caches counted once).
          properties:
            l1Bytes: { type: [integer, "null"] }
            l2Bytes: { type: [integer, "null"] }
            l3Bytes: { type: [integer, "null"] }
        countersSource: { type: string, description: Where the scheduler counters come from (shown in the UI). }
    CpuMetrics:
      type: object
      required: [sampleIntervalMs, historyLength, current, history]
      properties:
        sampleIntervalMs: { type: integer, description: Interval between two samples (1000). }
        historyLength: { type: integer, description: Capacity of the history arrays (60). }
        current:
          $ref: "#/components/schemas/CpuSnapshot"
        history:
          type: object
          description: Last historyLength intervals, oldest first; all arrays have the same length.
          required: [usagePercent, speedMhz, temperatureCelsius, userPercent, kernelPercent]
          properties:
            usagePercent: { type: array, items: { type: number } }
            speedMhz: { type: array, items: { type: [number, "null"] } }
            temperatureCelsius: { type: array, items: { type: [number, "null"] } }
            userPercent: { type: array, items: { type: number } }
            kernelPercent: { type: array, items: { type: number } }
    CpuSnapshot:
      type: object
      description: >
        Values of one interval. Percentages are 0..100, rates are per second, numbers are rounded to
        two decimals; null = not reported by this platform.
      required: [usagePercent, perCoreUsagePercent, speedMhz, temperatureCelsius, processes, threads, handles,
                 uptimeSeconds, bootTime, breakdown, scheduler, topProcesses]
      properties:
        usagePercent: { type: number, minimum: 0, maximum: 100 }
        perCoreUsagePercent: { type: array, items: { type: number }, description: One entry per logical processor. }
        speedMhz: { type: [number, "null"] }
        temperatureCelsius: { type: [number, "null"] }
        processes: { type: integer }
        threads: { type: integer }
        handles: { type: [integer, "null"], description: Windows handles / Linux allocated file handles. }
        uptimeSeconds: { type: integer }
        bootTime: { type: string, format: date-time, description: UTC, e.g. "2026-09-14T08:12:41Z". }
        breakdown:
          type: object
          description: Share of CPU time per part; the five parts sum to 100 within rounding.
          required: [userPercent, kernelPercent, dpcPercent, interruptPercent, idlePercent]
          properties:
            userPercent: { type: number }
            kernelPercent: { type: number }
            dpcPercent: { type: number, description: Windows DPC / Linux softirq. }
            interruptPercent: { type: number }
            idlePercent: { type: number }
        scheduler:
          type: object
          required: [contextSwitchesPerSec, interruptsPerSec, systemCallsPerSec, dpcsPerSec]
          properties:
            contextSwitchesPerSec: { type: [number, "null"] }
            interruptsPerSec: { type: [number, "null"] }
            systemCallsPerSec: { type: [number, "null"], description: Always null on Linux. }
            dpcsPerSec: { type: [number, "null"], description: Windows DPCs queued / Linux softirqs. }
        topProcesses:
          type: array
          maxItems: 10
          description: Highest cpuPercent first (ties by pid).
          items:
            type: object
            required: [pid, name, cpuPercent, memoryBytes]
            properties:
              pid: { type: integer }
              name: { type: string }
              cpuPercent: { type: number, description: Share of the whole machine (all logical processors = 100). }
              memoryBytes: { type: integer, description: Private working set (Windows) / resident set size (Linux). }
    SystemInfo:
      type: object
      required: [hostName, osName, osVersion, userName, platform]
      properties:
        hostName: { type: string }
        osName: { type: string, description: 'e.g. "Windows 10 Home x64", "Ubuntu 24.04.1 LTS x86_64".' }
        osVersion: { type: string, description: 'e.g. "Version 10.0.19045", "Kernel 6.8.0-45-generic".' }
        userName: { type: string }
        platform: { type: string, enum: [windows, linux, macos] }
    SampleHelloResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: >
            Platform greeting: "hello from Windows", "hello from Linux" or "hello from MAC".
    Problem:
      type: object
      description: Error body (RFC 7807, media type application/problem+json).
      required: [type, title, status]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type; "about:blank" when generic.
        title:
          type: string
          description: Short, human-readable summary (e.g. "Unauthorized").
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
  responses:
    ServiceUnavailable:
      description: Data not measured yet (first sampling interval still running); retry later.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No route matches the request path.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Unexpected server-side failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotImplemented:
      description: The platform library of this backend does not provide the feature behind this endpoint.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
