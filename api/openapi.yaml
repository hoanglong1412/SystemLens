# SystemLens backend API contract (source of truth for backend and frontend).
# Conventions: docs/api-convention.md. Change only with the user's approval.
openapi: 3.1.0
info:
  title: SystemLens Backend API
  version: 0.3.0
  description: >
    Local HTTP API served by systemlens-backend (systemlens-backend.exe on Windows) on 127.0.0.1.
    The port is chosen at startup and reported to the Electron main process
    through the "SYSTEMLENS_READY {json}" stdout line.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "8765"
        description: Random in production (--port 0); 8765 when started by Tool/run-backend.ps1.
security:
  - bearerAuth: []
tags:
  - name: sample
    description: >
      Sample endpoints: exercise the FE <-> BE plumbing and serve as reference examples
      for real APIs. Registered only when the backend is built with SYSTEMLENS_ENABLE_SAMPLE_API=ON.
  - name: system
    description: Machine identity and the always-visible quick stats shown by the app shell.
  - name: performance
    description: >
      Live performance data of the Performance tab. Values come from a backend sampler that reads
      the operating system once per second and keeps the last 60 seconds of history.
  - name: processes
    description: "Process list and per-application usage accumulated since the backend started."
  - name: inventory
    description: "Services, startup items and user sessions. Answered with available=false on platforms that cannot provide them."
paths:
  /api/v1/system/overview:
    get:
      tags: [system]
      operationId: getSystemOverview
      summary: Machine identity, uptime and quick stats for the app shell (header, tabs, status bar).
      responses:
        "200":
          description: Current overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/performance/resources:
    get:
      tags: [performance]
      operationId: getPerformanceResources
      summary: Every monitored resource (CPU, memory, disks, network adapters, GPUs) with its 60-second history.
      responses:
        "200":
          description: Resource list in display order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceResources"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/performance/cpu:
    get:
      tags: [performance]
      operationId: getCpuPerformance
      summary: Everything shown by the Performance > CPU screen.
      responses:
        "200":
          description: Current CPU performance data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CpuPerformance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/performance/cpu/cores:
    get:
      tags: [performance]
      operationId: getCpuCores
      summary: "Usage and 60-second history of every logical processor."
      responses:
        "200":
          description: Current data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CpuCores"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/performance/memory:
    get:
      tags: [performance]
      operationId: getMemoryPerformance
      summary: "Everything shown by the Performance > Memory screen."
      responses:
        "200":
          description: Current data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryPerformance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/performance/disks:
    get:
      tags: [performance]
      operationId: getDiskPerformance
      summary: "Detail of every physical disk (Performance > Disk screens)."
      responses:
        "200":
          description: Current data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiskPerformance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/performance/networks:
    get:
      tags: [performance]
      operationId: getNetworkPerformance
      summary: "Detail of every network adapter (Performance > Ethernet / Wi-Fi screens)."
      responses:
        "200":
          description: Current data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkPerformance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/performance/gpus:
    get:
      tags: [performance]
      operationId: getGpuPerformance
      summary: "Detail of every graphics adapter (Performance > GPU screens)."
      responses:
        "200":
          description: Current data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GpuPerformance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/processes:
    get:
      tags: [processes]
      operationId: getProcesses
      summary: "Every process with CPU share, memory, owner and thread count."
      responses:
        "200":
          description: Current data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/apps/history:
    get:
      tags: [processes]
      operationId: getAppHistory
      summary: "Resource usage per application name, accumulated since the backend started."
      responses:
        "200":
          description: Current data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppHistory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/services:
    get:
      tags: [inventory]
      operationId: getServices
      summary: "Installed services with state and start type."
      responses:
        "200":
          description: Current data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/startup:
    get:
      tags: [inventory]
      operationId: getStartupItems
      summary: "Programs started at logon."
      responses:
        "200":
          description: Current data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartupList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users:
    get:
      tags: [inventory]
      operationId: getUsers
      summary: "Logged-on user sessions and resource usage per user."
      responses:
        "200":
          description: Current data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/sample/hello:
    get:
      tags: [sample]
      operationId: getSampleHello
      summary: Return a fixed greeting to prove FE <-> BE communication works.
      responses:
        "200":
          description: Greeting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleHelloResponse"
              example:
                message: "@@Hello world@@"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Random token generated by Electron main for each run and passed to the backend
        via the SYSTEMLENS_TOKEN environment variable. Not required when the backend runs with --dev.
  schemas:
    SampleHelloResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Always "@@Hello world@@".
    PercentHistory:
      type: array
      description: >
        Samples in percent (0..100), oldest first, one per sample interval. At most 61 items
        (60 seconds); shorter right after the backend started.
      items:
        type: number
    SystemOverview:
      type: object
      required:
        [machine, bootTime, uptimeSeconds, sampleIntervalMs, processCount, serviceCount, cpuPercent,
         memoryPercent, diskPercent, network, topMemoryProcess]
      properties:
        machine:
          $ref: "#/components/schemas/MachineInfo"
        bootTime:
          type: string
          format: date-time
          description: When the operating system booted (UTC, RFC 3339).
        uptimeSeconds:
          type: integer
          description: Seconds since bootTime.
        sampleIntervalMs:
          type: integer
          description: How often the backend samples the operating system (1000).
        processCount:
          type: integer
        serviceCount:
          type: [integer, "null"]
          description: Number of installed services; null when the platform provider cannot count them.
        cpuPercent:
          type: number
          description: Total CPU usage over the last sample interval (0..100).
        memoryPercent:
          type: number
          description: Physical memory in use (0..100).
        diskPercent:
          type: [number, "null"]
          description: Active time of the busiest disk over the last interval; null when there is no disk data.
        network:
          $ref: "#/components/schemas/NetworkThroughput"
        topMemoryProcess:
          oneOf:
            - $ref: "#/components/schemas/TopMemoryProcess"
            - type: "null"
          description: Process using the most memory; null when the process list is empty.
    MachineInfo:
      type: object
      required: [hostName, osName, osVersion, architecture, userName, sessionName]
      properties:
        hostName:
          type: string
        osName:
          type: string
          description: Product name, e.g. "Windows 10 Home" or "Ubuntu 24.04.1 LTS".
        osVersion:
          type: string
          description: Windows - major.minor.build; Linux - kernel release.
        architecture:
          type: string
          description: e.g. "x64", "arm64".
        userName:
          type: string
          description: User the backend runs as.
        sessionName:
          type: string
          description: Windows - window station name of the session ("Console", "RDP-Tcp#0"); Linux - session type ("x11", "wayland", "tty").
    NetworkThroughput:
      type: object
      required: [sendBitsPerSecond, receiveBitsPerSecond]
      properties:
        sendBitsPerSecond:
          type: number
        receiveBitsPerSecond:
          type: number
    TopMemoryProcess:
      type: object
      required: [name, memoryBytes]
      properties:
        name:
          type: string
        memoryBytes:
          type: integer
    PerformanceResources:
      type: object
      required: [resources]
      properties:
        resources:
          type: array
          description: Display order - cpu, memory, disks, network adapters, GPUs.
          items:
            $ref: "#/components/schemas/PerformanceResource"
    PerformanceResource:
      type: object
      description: One row of the resource sidebar. Fields that do not apply to the kind are null.
      required:
        [id, kind, name, description, percent, history, frequencyMhz, usedBytes, totalBytes,
         sendBitsPerSecond, receiveBitsPerSecond, temperatureCelsius]
      properties:
        id:
          type: string
          description: Stable identifier, e.g. "cpu", "memory", "disk0", "net-eth0", "gpu0".
        kind:
          type: string
          enum: [cpu, memory, disk, ethernet, wifi, gpu]
        name:
          type: string
          description: "Display name, e.g. \"CPU\", \"Disk 0 (C: E:)\", \"Wi-Fi\"."
        description:
          type: [string, "null"]
          description: Disk - media type ("SSD", "HDD"); network - adapter description; GPU - adapter model.
        percent:
          type: [number, "null"]
          description: >
            Current load (0..100): CPU usage, memory in use, disk active time, GPU utilization.
            Null for network adapters and when the value is not available.
        history:
          $ref: "#/components/schemas/PercentHistory"
          description: >
            Sparkline. Network adapters - total throughput scaled to the peak of the window
            (at least 100 kbit/s full scale). Unavailable values are sent as 0.
        frequencyMhz:
          type: [number, "null"]
          description: cpu only - current clock.
        usedBytes:
          type: [integer, "null"]
          description: memory only.
        totalBytes:
          type: [integer, "null"]
          description: memory only.
        sendBitsPerSecond:
          type: [number, "null"]
          description: ethernet / wifi only.
        receiveBitsPerSecond:
          type: [number, "null"]
          description: ethernet / wifi only.
        temperatureCelsius:
          type: [number, "null"]
          description: gpu only, when a sensor is readable.
    CpuPerformance:
      type: object
      required:
        [info, usagePercent, frequencyMhz, frequencyPercent, temperatureCelsius, processCount, threadCount,
         handleCount, bootTime, uptimeSeconds, history, topProcesses, timeBreakdown, scheduler]
      properties:
        info:
          $ref: "#/components/schemas/CpuInfo"
        usagePercent:
          type: number
          description: Total CPU usage over the last sample interval (0..100).
        frequencyMhz:
          type: [number, "null"]
          description: Current clock averaged over all logical processors.
        frequencyPercent:
          type: [number, "null"]
          description: frequencyMhz relative to the highest clock known (maximum reported by the OS or observed), 0..100.
        temperatureCelsius:
          type: [number, "null"]
          description: CPU package temperature; null when no sensor is readable (typical in virtual machines).
        processCount:
          type: integer
        threadCount:
          type: integer
        handleCount:
          type: [integer, "null"]
          description: Windows - open handles; Linux - allocated file handles (/proc/sys/fs/file-nr).
        bootTime:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
        history:
          $ref: "#/components/schemas/CpuHistory"
        topProcesses:
          type: array
          description: Up to 10 processes with the highest CPU usage over the last interval, highest first.
          items:
            $ref: "#/components/schemas/CpuProcess"
        timeBreakdown:
          $ref: "#/components/schemas/CpuTimeBreakdown"
        scheduler:
          $ref: "#/components/schemas/SchedulerActivity"
    CpuInfo:
      type: object
      required:
        [model, sockets, cores, logicalProcessors, baseSpeedMhz, virtualization, l1CacheBytes, l2CacheBytes,
         l3CacheBytes]
      properties:
        model:
          type: string
        sockets:
          type: integer
        cores:
          type: integer
        logicalProcessors:
          type: integer
        baseSpeedMhz:
          type: [number, "null"]
        virtualization:
          type: string
          enum: [enabled, disabled, unknown]
        l1CacheBytes:
          type: [integer, "null"]
          description: Sum of all L1 data and instruction caches.
        l2CacheBytes:
          type: [integer, "null"]
        l3CacheBytes:
          type: [integer, "null"]
    CpuHistory:
      type: object
      required: [usagePercent, frequencyPercent, temperatureCelsius]
      properties:
        usagePercent:
          $ref: "#/components/schemas/PercentHistory"
        frequencyPercent:
          type: array
          description: Same sample times as usagePercent; null where the clock was not available.
          items:
            type: [number, "null"]
        temperatureCelsius:
          type: array
          description: Same sample times as usagePercent; null where the temperature was not available.
          items:
            type: [number, "null"]
    CpuProcess:
      type: object
      required: [pid, name, cpuPercent, memoryBytes, isSelf]
      properties:
        pid:
          type: integer
        name:
          type: string
        cpuPercent:
          type: number
          description: Share of the total capacity of all logical processors (0..100).
        memoryBytes:
          type: integer
          description: Windows - private working set; Linux - resident set size.
        isSelf:
          type: boolean
          description: True for the backend itself and the process that started it (the SystemLens UI).
    CpuTimeBreakdown:
      type: object
      description: How CPU time of the last interval was split, all cores together. The five percents add up to 100.
      required: [userPercent, kernelPercent, dpcPercent, interruptPercent, idlePercent, history]
      properties:
        userPercent:
          type: number
        kernelPercent:
          type: number
          description: Kernel time excluding dpcPercent and interruptPercent.
        dpcPercent:
          type: number
          description: Windows - DPC time; Linux - softirq time.
        interruptPercent:
          type: number
          description: Hardware interrupt time.
        idlePercent:
          type: number
          description: Linux - includes iowait and steal.
        history:
          type: object
          required: [userPercent, kernelPercent]
          properties:
            userPercent:
              $ref: "#/components/schemas/PercentHistory"
            kernelPercent:
              $ref: "#/components/schemas/PercentHistory"
              description: Kernel + DPC + interrupt.
    SchedulerActivity:
      type: object
      description: System-wide rates over the last interval; null when the platform does not expose the counter.
      required: [contextSwitchesPerSecond, interruptsPerSecond, systemCallsPerSecond, dpcsPerSecond, source]
      properties:
        contextSwitchesPerSecond:
          type: [number, "null"]
        interruptsPerSecond:
          type: [number, "null"]
        systemCallsPerSecond:
          type: [number, "null"]
          description: Not available on Linux.
        dpcsPerSecond:
          type: [number, "null"]
          description: Windows - DPCs queued; Linux - softirqs raised.
        source:
          type: string
          description: Where the counters come from, e.g. "PDH \System, \Processor(_Total)" or "/proc/stat".
    RateHistory:
      type: array
      description: "Raw samples (bytes per second or bits per second, see the field), oldest first, at most 61 items. The frontend scales them to the peak of the window."
      items:
        type: number
    AvailabilityFields:
      type: object
      description: "Fields shared by the inventory responses (documentation only, repeated in each response)."
      properties:
        available:
          type: boolean
        reason:
          type: [string, "null"]
    CpuCores:
      type: object
      required: [cores]
      properties:
        cores:
          type: array
          description: "One item per logical processor, in index order."
          items:
            $ref: "#/components/schemas/CoreUsage"
    CoreUsage:
      type: object
      required: [index, usagePercent, history]
      properties:
        index:
          type: integer
        usagePercent:
          type: number
        history:
          $ref: "#/components/schemas/PercentHistory"
    MemoryPerformance:
      type: object
      required: [totalBytes, usedBytes, availableBytes, cachedBytes, committedBytes, commitLimitBytes, usedPercent, history, topProcesses]
      properties:
        totalBytes:
          type: integer
        usedBytes:
          type: integer
          description: "total - available."
        availableBytes:
          type: integer
        cachedBytes:
          type: [integer, "null"]
          description: "Windows - system cache; Linux - Cached + Buffers."
        committedBytes:
          type: [integer, "null"]
          description: "Windows - CommitTotal; Linux - Committed_AS."
        commitLimitBytes:
          type: [integer, "null"]
          description: "Windows - CommitLimit; Linux - CommitLimit."
        usedPercent:
          type: number
        history:
          $ref: "#/components/schemas/PercentHistory"
        topProcesses:
          type: array
          description: "Up to 10 processes using the most memory, highest first."
          items:
            $ref: "#/components/schemas/CpuProcess"
    DiskPerformance:
      type: object
      required: [disks]
      properties:
        disks:
          type: array
          items:
            $ref: "#/components/schemas/DiskDetail"
    DiskDetail:
      type: object
      required: [id, name, model, kind, capacityBytes, activePercent, readBytesPerSecond, writeBytesPerSecond, activeHistory, readHistory, writeHistory]
      properties:
        id:
          type: string
          description: "Same id as the matching PerformanceResource."
        name:
          type: string
        model:
          type: [string, "null"]
        kind:
          type: string
          enum: [ssd, hdd, unknown]
        capacityBytes:
          type: [integer, "null"]
        activePercent:
          type: [number, "null"]
        readBytesPerSecond:
          type: [number, "null"]
        writeBytesPerSecond:
          type: [number, "null"]
        activeHistory:
          $ref: "#/components/schemas/PercentHistory"
        readHistory:
          $ref: "#/components/schemas/RateHistory"
        writeHistory:
          $ref: "#/components/schemas/RateHistory"
    NetworkPerformance:
      type: object
      required: [adapters]
      properties:
        adapters:
          type: array
          items:
            $ref: "#/components/schemas/NetworkDetail"
    NetworkDetail:
      type: object
      required: [id, name, kind, description, macAddress, linkSpeedBitsPerSecond, sendBitsPerSecond, receiveBitsPerSecond, sendHistory, receiveHistory]
      properties:
        id:
          type: string
          description: "Same id as the matching PerformanceResource."
        name:
          type: string
          description: "Adapter name as the operating system shows it."
        kind:
          type: string
          enum: [ethernet, wifi]
        description:
          type: [string, "null"]
        macAddress:
          type: [string, "null"]
        linkSpeedBitsPerSecond:
          type: [number, "null"]
        sendBitsPerSecond:
          type: number
        receiveBitsPerSecond:
          type: number
        sendHistory:
          $ref: "#/components/schemas/RateHistory"
        receiveHistory:
          $ref: "#/components/schemas/RateHistory"
    GpuPerformance:
      type: object
      required: [gpus]
      properties:
        gpus:
          type: array
          items:
            $ref: "#/components/schemas/GpuDetail"
    GpuDetail:
      type: object
      required: [id, name, model, utilizationPercent, temperatureCelsius, memoryTotalBytes, memoryUsedBytes, history]
      properties:
        id:
          type: string
          description: "Same id as the matching PerformanceResource."
        name:
          type: string
        model:
          type: string
        utilizationPercent:
          type: [number, "null"]
        temperatureCelsius:
          type: [number, "null"]
        memoryTotalBytes:
          type: [integer, "null"]
        memoryUsedBytes:
          type: [integer, "null"]
          description: "Only where the driver reports it (Linux amdgpu)."
        history:
          $ref: "#/components/schemas/PercentHistory"
    ProcessList:
      type: object
      required: [processes]
      properties:
        processes:
          type: array
          description: "Highest CPU first."
          items:
            $ref: "#/components/schemas/ProcessEntry"
    ProcessEntry:
      type: object
      required: [pid, parentPid, name, userName, cpuPercent, cpuTimeSeconds, memoryBytes, threadCount, status, commandLine, isSelf]
      properties:
        pid:
          type: integer
        parentPid:
          type: integer
        name:
          type: string
        userName:
          type: [string, "null"]
          description: "Owner; null when the operating system does not let the backend read it."
        cpuPercent:
          type: number
          description: "Share of the total capacity of all logical processors (0..100)."
        cpuTimeSeconds:
          type: number
          description: "Cumulative user + kernel CPU time."
        memoryBytes:
          type: integer
          description: "Windows - private working set; Linux - resident set size."
        threadCount:
          type: [integer, "null"]
        status:
          type: [string, "null"]
          description: "Linux only, e.g. Running, Sleeping, Zombie."
        commandLine:
          type: [string, "null"]
          description: "Linux only."
        isSelf:
          type: boolean
    AppHistory:
      type: object
      required: [since, apps]
      properties:
        since:
          type: string
          format: date-time
          description: "When the backend started collecting; usage is accumulated from then on, in memory only."
        apps:
          type: array
          description: "Highest accumulated CPU time first, at most 200 items."
          items:
            $ref: "#/components/schemas/AppUsage"
    AppUsage:
      type: object
      required: [name, cpuTimeSeconds, peakMemoryBytes, memoryBytes, runningInstances]
      properties:
        name:
          type: string
        cpuTimeSeconds:
          type: number
          description: "CPU time used by every instance since the backend started, including instances that already exited."
        peakMemoryBytes:
          type: integer
          description: "Highest sum over the running instances seen in one sample."
        memoryBytes:
          type: integer
          description: "Sum over the instances running now."
        runningInstances:
          type: integer
    ServiceList:
      type: object
      required: [available, reason, services]
      properties:
        available:
          type: boolean
        reason:
          type: [string, "null"]
          description: "Why the list is not available (e.g. systemd missing, not implemented)."
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceEntry"
    ServiceEntry:
      type: object
      required: [name, displayName, description, state, startType, pid]
      properties:
        name:
          type: string
        displayName:
          type: string
        description:
          type: [string, "null"]
        state:
          type: string
          enum: [running, stopped, starting, stopping, paused, other]
        startType:
          type: string
          enum: [automatic, manual, disabled, static, other]
        pid:
          type: [integer, "null"]
          description: "Windows only."
    StartupList:
      type: object
      required: [available, reason, items]
      properties:
        available:
          type: boolean
        reason:
          type: [string, "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/StartupEntry"
    StartupEntry:
      type: object
      required: [name, command, location, scope, enabled]
      properties:
        name:
          type: string
        command:
          type: string
        location:
          type: string
          description: "Registry key or folder the entry comes from."
        scope:
          type: string
          enum: [user, allUsers]
        enabled:
          type: boolean
    UserList:
      type: object
      required: [available, reason, sessions, users]
      properties:
        available:
          type: boolean
          description: "Refers to sessions; users is always computed from the process list."
        reason:
          type: [string, "null"]
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/UserSession"
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserUsage"
    UserSession:
      type: object
      required: [userName, sessionId, sessionName, state, logonTime, host]
      properties:
        userName:
          type: string
        sessionId:
          type: [string, "null"]
        sessionName:
          type: string
        state:
          type: string
          description: "Active, Connected, Disconnected or Other."
        logonTime:
          type: [string, "null"]
          format: date-time
        host:
          type: [string, "null"]
          description: "Remote host or client name, when the session is remote."
    UserUsage:
      type: object
      required: [userName, processCount, cpuPercent, memoryBytes]
      properties:
        userName:
          type: string
          description: "Owner of the processes; (unknown) groups processes whose owner cannot be read."
        processCount:
          type: integer
        cpuPercent:
          type: number
        memoryBytes:
          type: integer
    Problem:
      type: object
      description: Error body (RFC 7807, media type application/problem+json).
      required: [type, title, status]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type; "about:blank" when generic.
        title:
          type: string
          description: Short, human-readable summary (e.g. "Unauthorized").
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No route matches the request path.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Unexpected server-side failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
